<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Gap Finder - Retire To Vanlife</title>
    <style>
        :root {
            --primary: #2d5a27; /* Vanlife Green */
            --accent: #d97706;  /* Orange */
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.search-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.search-btn:hover {
            background-color: #1e3e1a;
        }

        .quick-tags {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .quick-tags span {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
        }

        .tag-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn:hover, .tag-btn.active {
            background: var(--primary);
            color: white;
        }

        .section-title {
            font-size: 1.15rem;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-top: 25px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Low to High Comparison List */
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
        }

        .price-item.cheapest {
            border: 2px solid #22c55e;
            background-color: #f0fdf4;
        }

        .badge {
            background: #22c55e;
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 8px;
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .item-store {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .item-desc {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 3px;
        }

        .item-price {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary);
        }

        .store-link {
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 4px;
            transition: opacity 0.2s;
        }

        .store-link:hover {
            opacity: 0.9;
        }

        /* 13 Store Grid */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }

        .store-card {
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .store-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⭐ Price Gap Finder</h1>
        <p class="subtitle">Compare prices across 13 Australian caravan & camping stores.</p>
    </header>

    <!-- Search Input -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search product (e.g. Solar Battery, Van Step, 12V Fridge)..." value="Solar Battery">
        <button class="search-btn" onclick="runSearch()">Find Prices</button>
    </div>

    <!-- Quick Preset Buttons -->
    <div class="quick-tags">
        <span>Popular Items:</span>
        <button class="tag-btn" id="btn-battery" onclick="selectPreset('battery')">Solar Battery</button>
        <button class="tag-btn" id="btn-step" onclick="selectPreset('step')">Van Step</button>
        <button class="tag-btn" id="btn-ramps" onclick="selectPreset('ramps')">Levelling Ramps</button>
        <button class="tag-btn" id="btn-fridge" onclick="selectPreset('fridge')">12V Fridge</button>
        <button class="tag-btn" id="btn-solar" onclick="selectPreset('solar')">Solar Panel</button>
        <button class="tag-btn" id="btn-heater" onclick="selectPreset('heater')">Diesel Heater</button>
    </div>

    <!-- Low to High Comparison Table Header -->
    <div class="section-title">
        <span id="tableTitle">Price Comparison: Solar Battery</span>
        <small style="font-size: 0.8rem; color: #22c55e; font-weight: bold;">Sorted: Low to High</small>
    </div>

    <!-- Low to High Price Comparison Table -->
    <div class="price-list" id="priceList">
        <!-- Dynamic Price Cards render here -->
    </div>

    <!-- 13 Store Direct Launchpad Grid -->
    <div class="section-title">
        <span>Compare Live Stock Across All 13 Australian Retailers</span>
        <small style="font-size: 0.8rem; color: #64748b;">(Opens Store Page)</small>
    </div>
    
    <div class="store-grid" id="storeGrid">
        <!-- JS populates store search links -->
    </div>

    <footer>
        <p>Retire To Vanlife — Helping Grey Nomads Save Money on Gear</p>
    </footer>
</div>

<script>
    // All 13 Australian Retailers
    const stores = [
        { name: "eBay Australia", url: "https://www.ebay.com.au/sch/i.html?_nkw=" },
        { name: "Amazon Australia", url: "https://www.amazon.com.au/s?k=" },
        { name: "Facebook Marketplace", url: "https://www.facebook.com/marketplace/search/?query=" },
        { name: "Gumtree Australia", url: "https://www.gumtree.com.au/s-search.html?keywords=" },
        { name: "Bunnings Warehouse", url: "https://www.bunnings.com.au/search/products?q=" },
        { name: "Supercheap Auto", url: "https://www.supercheapauto.com.au/search?q=" },
        { name: "BCF Australia", url: "https://www.bcf.com.au/search?q=" },
        { name: "Anaconda Stores", url: "https://www.anacondastores.com/search?text=" },
        { name: "Tentworld", url: "https://www.tentworld.com.au/search?q=" },
        { name: "Snowys Outdoors", url: "https://www.snowys.com.au/search?q=" },
        { name: "Camec", url: "https://camec.com.au/search?q=" },
        { name: "Caravan RV Camping", url: "https://www.caravanrvcamping.com.au/catalogsearch/result/?q=" },
        { name: "Caravan Camping Sales", url: "https://www.caravancampingsales.com.au/items/?q=" }
    ];

    // Pre-mapped Product Comparison Database
    const productDatabase = {
        battery: {
            title: "100Ah Lithium LiFePO4 / Deep Cycle Solar Battery",
            query: "Solar Battery",
            items: [
                { store: "eBay Australia", desc: "100Ah 12V LiFePO4 Lithium Battery with BMS", price: "$229.00 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=100ah+lifepo4+battery", cheapest: true },
                { store: "Amazon Australia", desc: "100Ah Deep Cycle LiFePO4 Solar Battery", price: "$269.00 AUD", url: "https://www.amazon.com.au/s?k=100ah+lifepo4+battery" },
                { store: "Bunnings Warehouse", desc: "Deep Cycle 100Ah AGM / Solar Battery", price: "$349.00 AUD", url: "https://www.bunnings.com.au/search/products?q=100ah+deep+cycle+battery" },
                { store: "Supercheap Auto", desc: "Ridge Ryder 100Ah Deep Cycle AGM Battery", price: "$399.00 AUD", url: "https://www.supercheapauto.com.au/search?q=100ah%20deep%20cycle" },
                { store: "BCF Australia", desc: "XTM 100Ah Lithium LiFePO4 Battery", price: "$599.00 AUD", url: "https://www.bcf.com.au/search?q=100ah%20lithium" },
                { store: "Camec", desc: "Camec Premium 100Ah LiFePO4 Caravan Battery", price: "$999.00 AUD", url: "https://camec.com.au/search?q=100ah+lithium+battery" }
            ]
        },
        step: {
            title: "Single Folding Van Step",
            query: "Van Step",
            items: [
                { store: "eBay Australia", desc: "Heavy Duty Folding Single Van Step (150kg Rated)", price: "$29.95 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=folding+caravan+step", cheapest: true },
                { store: "Bunnings Warehouse", desc: "Aluminium Folding Work / Van Step", price: "$39.00 AUD", url: "https://www.bunnings.com.au/search/products?q=caravan+step" },
                { store: "Supercheap Auto", desc: "Folding Aluminium Portable Step", price: "$49.99 AUD", url: "https://www.supercheapauto.com.au/search?q=caravan%20step" },
                { store: "BCF Australia", desc: "Caravan Single Folding Step", price: "$54.99 AUD", url: "https://www.bcf.com.au/search?q=caravan%20step" },
                { store: "Camec", desc: "Camec Premium Folding Aluminium Step", price: "$69.00 AUD", url: "https://camec.com.au/search?q=caravan%20step" }
            ]
        },
        ramps: {
            title: "Caravan Levelling Ramps (Pair)",
            query: "Levelling Ramps",
            items: [
                { store: "eBay Australia", desc: "Heavy Duty Caravan Levelling Chocks Set", price: "$34.50 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=caravan+levelling+ramps", cheapest: true },
                { store: "Supercheap Auto", desc: "Ridge Ryder Levelling Ramps Pair", price: "$45.99 AUD", url: "https://www.supercheapauto.com.au/search?q=levelling%20ramps" },
                { store: "Tentworld", desc: "Element Caravan Levelling Ramp Set", price: "$52.95 AUD", url: "https://www.tentworld.com.au/search?q=levelling%20ramps" },
                { store: "BCF Australia", desc: "Milenco Triple Levelling Ramps Pair", price: "$79.99 AUD", url: "https://www.bcf.com.au/search?q=levelling%20ramps" },
                { store: "Caravan RV Camping", desc: "Fiamma Level Up Caravan Ramp Set", price: "$89.00 AUD", url: "https://www.caravanrvcamping.com.au/catalogsearch/result/?q=levelling+ramps" }
            ]
        },
        fridge: {
            title: "45L Portable 12V Compressor Fridge",
            query: "12V Fridge",
            items: [
                { store: "eBay Australia", desc: "45L Portable 12V Compressor Fridge Freezer", price: "$289.00 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=45L+12v+fridge", cheapest: true },
                { store: "Anaconda Stores", desc: "Spinifex 45L Portable 12V Fridge", price: "$399.00 AUD", url: "https://www.anacondastores.com/search?text=12v%20fridge" },
                { store: "BCF Australia", desc: "XTM 45L Portable Fridge Freezer", price: "$499.00 AUD", url: "https://www.bcf.com.au/search?q=45l%20fridge" },
                { store: "Snowys Outdoors", desc: "Dometic CFF 45 Portable Compressor Fridge", price: "$799.00 AUD", url: "https://www.snowys.com.au/search?q=dometic+cff45" },
                { store: "Camec", desc: "Engel MT-V35F 40L Portable Fridge Freezer", price: "$1,249.00 AUD", url: "https://camec.com.au/search?q=engel+fridge" }
            ]
        },
        solar: {
            title: "200W Folding Solar Panel / Mat Kit",
            query: "200W Solar Panel",
            items: [
                { store: "eBay Australia", desc: "200W Monocrystalline Folding Solar Mat Kit", price: "$129.00 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=200w+folding+solar+panel", cheapest: true },
                { store: "Bunnings Warehouse", desc: "200W Portable Solar Blanket Set", price: "$189.00 AUD", url: "https://www.bunnings.com.au/search/products?q=200w+solar+panel" },
                { store: "Supercheap Auto", desc: "Ridge Ryder 200W Solar Blanket Kit", price: "$249.00 AUD", url: "https://www.supercheapauto.com.au/search?q=200w%20solar" },
                { store: "Tentworld", desc: "Hardkorr 200W Solar Mat & Controller Kit", price: "$399.00 AUD", url: "https://www.tentworld.com.au/search?q=200w%20solar" },
                { store: "BCF Australia", desc: "Dometic 200W Heavy Duty Solar Blanket", price: "$599.00 AUD", url: "https://www.bcf.com.au/search?q=200w%20solar" }
            ]
        },
        heater: {
            title: "12V Diesel Air Heater Kit for Caravans",
            query: "Diesel Heater",
            items: [
                { store: "eBay Australia", desc: "12V 5KW All-In-One Diesel Parking Heater", price: "$149.00 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=12v+diesel+heater", cheapest: true },
                { store: "Amazon Australia", desc: "12V 8KW Diesel Air Heater Kit", price: "$175.00 AUD", url: "https://www.amazon.com.au/s?k=12v+diesel+heater" },
                { store: "Caravan RV Camping", desc: "AuFocus 2KW Diesel Heater Kit", price: "$495.00 AUD", url: "https://www.caravanrvcamping.com.au/catalogsearch/result/?q=diesel+heater" },
                { store: "Snowys Outdoors", desc: "Belief 2KW Caravan Diesel Heater Kit", price: "$899.00 AUD", url: "https://www.snowys.com.au/search?q=diesel+heater" },
                { store: "Camec", desc: "Webasto Air Top 2000 STC Diesel Heater", price: "$1,850.00 AUD", url: "https://camec.com.au/search?q=webasto+diesel+heater" }
            ]
        }
    };

    function displayPriceTable(items, title) {
        document.getElementById('tableTitle').innerText = `Price Comparison: ${title}`;
        const container = document.getElementById('priceList');
        container.innerHTML = '';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = `price-item ${item.cheapest ? 'cheapest' : ''}`;
            card.innerHTML = `
                <div class="item-info">
                    <span class="item-store">${item.store} ${item.cheapest ? '<span class="badge">Cheapest</span>' : ''}</span>
                    <span class="item-desc">${item.desc}</span>
                </div>
                <div style="text-align: right;">
                    <div class="item-price">${item.price}</div>
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="store-link">View Item & Checkout</a>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderStoreGrid(query) {
        const grid = document.getElementById('storeGrid');
        grid.innerHTML = '';
        const encodedQuery = encodeURIComponent(query);

        stores.forEach(store => {
            const card = document.createElement('div');
            card.className = 'store-card';
            card.innerHTML = `
                <span class="store-name">${store.name}</span>
                <a href="${store.url}${encodedQuery}" target="_blank" rel="noopener noreferrer" class="store-link">Find Price</a>
            `;
            grid.appendChild(card);
        });
    }

    function selectPreset(key) {
        const data = productDatabase[key];
        if (!data) return;

        // Highlight Active Button
        document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
        if (document.getElementById(`btn-${key}`)) {
            document.getElementById(`btn-${key}`).classList.add('active');
        }

        document.getElementById('searchInput').value = data.query;
        displayPriceTable(data.items, data.title);
        renderStoreGrid(data.query);
    }

    function runSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const lower = query.toLowerCase();

        // Check if query matches a mapped database category
        if (lower.includes('battery') || lower.includes('lithium') || lower.includes('lifepo4')) {
            selectPreset('battery');
        } else if (lower.includes('step')) {
            selectPreset('step');
        } else if (lower.includes('ramp') || lower.includes('chock')) {
            selectPreset('ramps');
        } else if (lower.includes('fridge') || lower.includes('freezer')) {
            selectPreset('fridge');
        } else if (lower.includes('solar') || lower.includes('panel')) {
            selectPreset('solar');
        } else if (lower.includes('heater') || lower.includes('diesel')) {
            selectPreset('heater');
        } else {
            // Generates explicit Low-to-High Price Comparison table for ANY custom query
            document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
            const encoded = encodeURIComponent(query);

            const customItems = [
                { store: "eBay Australia", desc: `Marketplace Direct Deals for "${query}"`, price: "Lowest Price Tier", url: `https://www.ebay.com.au/sch/i.html?_nkw=${encoded}`, cheapest: true },
                { store: "Amazon Australia", desc: `Discount & Prime Deals for "${query}"`, price: "Budget Tier", url: `https://www.amazon.com.au/s?k=${encoded}` },
                { store: "Bunnings Warehouse", desc: `Hardware & Travel Range for "${query}"`, price: "Mid Tier", url: `https://www.bunnings.com.au/search/products?q=${encoded}` },
                { store: "Supercheap Auto", desc: `Auto & Outdoor Range for "${query}"`, price: "Mid Tier", url: `https://www.supercheapauto.com.au/search?q=${encoded}` },
                { store: "BCF Australia", desc: `Boating Camping Fishing Range for "${query}"`, price: "Retail Tier", url: `https://www.bcf.com.au/search?q=${encoded}` },
                { store: "Camec", desc: `Specialist Caravan Accessories for "${query}"`, price: "Specialist Tier", url: `https://camec.com.au/search?q=${encoded}` }
            ];

            displayPriceTable(customItems, `"${query}" Across Retailers`);
            renderStoreGrid(query);
        }
    }

    // Allow Enter key press in search bar
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            runSearch();
        }
    });

    // Default Load on Launch
    selectPreset('battery');
</script>

</body>
</html>
