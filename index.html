<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Gap Finder - Retire To Vanlife</title>
    <style>
        :root {
            --primary: #2d5a27; /* Vanlife Green */
            --accent: #d97706;  /* Orange */
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.search-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.search-btn:hover {
            background-color: #1e3e1a;
        }

        .quick-tags {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .quick-tags span {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
        }

        .tag-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn:hover, .tag-btn.active {
            background: var(--primary);
            color: white;
        }

        .section-title {
            font-size: 1.15rem;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-top: 25px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Low to High Price Comparison List */
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
        }

        .price-item.cheapest {
            border: 2px solid #22c55e;
            background-color: #f0fdf4;
        }

        .badge {
            background: #22c55e;
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 8px;
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .item-store {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .item-desc {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 3px;
        }

        .item-price {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary);
        }

        .store-link {
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 4px;
            transition: opacity 0.2s;
        }

        .store-link:hover {
            opacity: 0.9;
        }

        /* 13 Store Grid */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }

        .store-card {
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .store-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
    </style>
</head>
