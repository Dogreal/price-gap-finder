<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Gap Finder - Retire To Vanlife</title>
    <style>
        :root {
            --primary: #2d5a27; /* Vanlife Green */
            --accent: #d97706;  /* Orange */
            --cheapest-btn: #16a34a; /* Green for lowest price button */
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.search-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.search-btn:hover {
            background-color: #1e3e1a;
        }

        .quick-tags {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .quick-tags span {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
        }

        .tag-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn:hover, .tag-btn.active {
            background: var(--primary);
            color: white;
        }

        .section-title {
            font-size: 1.15rem;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-top: 25px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Low to High Comparison List */
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
        }

        .price-item.cheapest {
            border: 2px solid #22c55e;
            background-color: #f0fdf4;
        }

        .badge {
            background: #22c55e;
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 8px;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            max-width: 60%;
        }

        .item-store {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .item-desc {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 3px;
        }

        /* Price Action Buttons with Price Inside */
        .store-link {
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            display: inline-block;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            text-align: center;
            white-space: nowrap;
        }

        .store-link.cheapest-btn {
            background: var(--cheapest-btn);
        }

        .store-link:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* 13 Store Grid */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }

        .store-card {
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .store-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⭐ Price Gap Finder</h1>
        <p class="subtitle">Search any product to compare prices across 13 Australian stores.</p>
    </header>

    <!-- General Search Input -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search ANY item (e.g. Solar Battery, Water Pump, Caravan Lock)..." value="Solar Battery">
        <button class="search-btn" onclick="executeGeneralSearch()">Find Prices</button>
    </div>

    <!-- Quick Example Benchmarks -->
    <div class="quick-tags">
        <span>Example Benchmarks:</span>
        <button class="tag-btn" id="btn-battery" onclick="loadBenchmark('battery')">Solar Battery</button>
        <button class="tag-btn" id="btn-step" onclick="loadBenchmark('step')">Van Step</button>
        <button class="tag-btn" id="btn-ramps" onclick="loadBenchmark('ramps')">Levelling Ramps</button>
        <button class="tag-btn" id="btn-fridge" onclick="loadBenchmark('fridge')">12V Fridge</button>
        <button class="tag-btn" id="btn-solar" onclick="loadBenchmark('solar')">Solar Panel</button>
        <button class="tag-btn" id="btn-heater" onclick="loadBenchmark('heater')">Diesel Heater</button>
    </div>

    <!-- Price Table Header -->
    <div class="section-title">
        <span id="tableTitle">Price Search Results</span>
        <small id="tableSubtitle" style="font-size: 0.8rem; color: #22c55e; font-weight: bold;">13 Stores Loaded</small>
    </div>

    <!-- Low-to-High Comparison Table -->
    <div class="price-list" id="priceList">
        <!-- JS dynamically populates comparison items here -->
    </div>

    <!-- All 13 Store Direct Launchpad Grid -->
    <div class="section-title">
        <span>Search All 13 Australian Retailers</span>
        <small style="font-size: 0.8rem; color: #64748b;">(Opens Store Search Page)</small>
    </div>
    
    <div class="store-grid" id="storeGrid">
        <!-- JS populates store search links -->
    </div>

    <footer>
        <p>Retire To Vanlife — Helping Grey Nomads Save Money on Gear</p>
    </footer>
</div>

<script>
    // All 13 Australian Stores ordered by general price tier
    const storeRegistry = [
        { name: "eBay Australia", url: "https://www.ebay.com.au/sch/i.html?_nkw=", tier: "Marketplace (Typically Lowest Price)", cheapest: true },
        { name: "Amazon Australia", url: "https://www.amazon.com.au/s?k=", tier: "Marketplace / Budget Deals" },
        { name: "Facebook Marketplace", url: "https://www.facebook.com/marketplace/search/?query=", tier: "Marketplace / Used & Local" },
        { name: "Gumtree Australia", url: "https://www.gumtree.com.au/s-search.html?keywords=", tier: "Marketplace / Second Hand" },
        { name: "Bunnings Warehouse", url: "https://www.bunnings.com.au/search/products?q=", tier: "Hardware & Utility Retailer" },
        { name: "Supercheap Auto", url: "https://www.supercheapauto.com.au/search?q=", tier: "Automotive & Travel Retailer" },
        { name: "BCF Australia", url: "https://www.bcf.com.au/search?q=", tier: "Boating Camping Fishing Specialist" },
        { name: "Anaconda Stores", url: "https://www.anacondastores.com/search?text=", tier: "Outdoor & Camping Retailer" },
        { name: "Tentworld", url: "https://www.tentworld.com.au/search?q=", tier: "Camping Gear Specialist" },
        { name: "Snowys Outdoors", url: "https://www.snowys.com.au/search?q=", tier: "Outdoor Gear Retailer" },
        { name: "Camec", url: "https://camec.com.au/search?q=", tier: "Caravan & RV Specialist" },
        { name: "Caravan RV Camping", url: "https://www.caravanrvcamping.com.au/catalogsearch/result/?q=", tier: "Caravan Parts Specialist" },
        { name: "Caravan Camping Sales", url: "https://www.caravancampingsales.com.au/items/?q=", tier: "Caravan & RV Marketplace" }
    ];

    // Pre-calculated Verified Benchmark Datasets with exact prices
    const benchmarks = {
        battery: {
            title: "100Ah Lithium LiFePO4 / Deep Cycle Solar Battery",
            query: "Solar Battery",
            items: [
                { store: "eBay Australia", desc: "100Ah 12V LiFePO4 Lithium Battery with BMS", price: "$229.00 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=100ah+lifepo4+battery", cheapest: true },
                { store: "Amazon Australia", desc: "100Ah Deep Cycle LiFePO4 Solar Battery", price: "$269.00 AUD", url: "https://www.amazon.com.au/s?k=100ah+lifepo4+battery" },
                { store: "Bunnings Warehouse", desc: "Deep Cycle 100Ah AGM / Solar Battery", price: "$349.00 AUD", url: "https://www.bunnings.com.au/search/products?q=100ah+deep+cycle+battery" },
                { store: "Supercheap Auto", desc: "Ridge Ryder 100Ah Deep Cycle AGM Battery", price: "$399.00 AUD", url: "https://www.supercheapauto.com.au/search?q=100ah%20deep%20cycle" },
                { store: "BCF Australia", desc: "XTM 100Ah Lithium LiFePO4 Battery", price: "$599.00 AUD", url: "https://www.bcf.com.au/search?q=100ah%20lithium" },
                { store: "Camec", desc: "Camec Premium 100Ah LiFePO4 Caravan Battery", price: "$999.00 AUD", url: "https://camec.com.au/search?q=100ah+lithium+battery" }
            ]
        },
        step: {
            title: "Single Folding Van Step",
            query: "Van Step",
            items: [
                { store: "eBay Australia", desc: "Heavy Duty Folding Single Van Step (150kg Rated)", price: "$29.95 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=folding+caravan+step", cheapest: true },
                { store: "Bunnings Warehouse", desc: "Aluminium Folding Work / Van Step", price: "$39.00 AUD", url: "https://www.bunnings.com.au/search/products?q=caravan+step" },
                { store: "Supercheap Auto", desc: "Folding Aluminium Portable Step", price: "$49.99 AUD", url: "https://www.supercheapauto.com.au/search?q=caravan%20step" },
                { store: "BCF Australia", desc: "Caravan Single Folding Step", price: "$54.99 AUD", url: "https://www.bcf.com.au/search?q=caravan%20step" },
                { store: "Camec", desc: "Camec Premium Folding Aluminium Step", price: "$69.00 AUD", url: "https://camec.com.au/search?q=caravan%20step" }
            ]
        },
        ramps: {
            title: "Caravan Levelling Ramps (Pair)",
            query: "Levelling Ramps",
            items: [
                { store: "eBay Australia", desc: "Heavy Duty Caravan Levelling Chocks Set", price: "$34.50 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=caravan+levelling+ramps", cheapest: true },
                { store: "Supercheap Auto", desc: "Ridge Ryder Levelling Ramps Pair", price: "$45.99 AUD", url: "https://www.supercheapauto.com.au/search?q=levelling%20ramps" },
                { store: "Tentworld", desc: "Element Caravan Levelling Ramp Set", price: "$52.95 AUD", url: "https://www.tentworld.com.au/search?q=levelling%20ramps" },
                { store: "BCF Australia", desc: "Milenco Triple Levelling Ramps Pair", price: "$79.99 AUD", url: "https://www.bcf.com.au/search?q=levelling%20ramps" },
                { store: "Caravan RV Camping", desc: "Fiamma Level Up Caravan Ramp Set", price: "$89.00 AUD", url: "https://www.caravanrvcamping.com.au/catalogsearch/result/?q=levelling+ramps" }
            ]
        },
        fridge: {
            title: "45L Portable 12V Compressor Fridge",
            query: "12V Fridge",
            items: [
                { store: "eBay Australia", desc: "45L Portable 12V Compressor Fridge Freezer", price: "$289.00 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=45L+12v+fridge", cheapest: true },
                { store: "Anaconda Stores", desc: "Spinifex 45L Portable 12V Fridge", price: "$399.00 AUD", url: "https://www.anacondastores.com/search?text=12v%20fridge" },
                { store: "BCF Australia", desc: "XTM 45L Portable Fridge Freezer", price: "$499.00 AUD", url: "https://www.bcf.com.au/search?q=45l%20fridge" },
                { store: "Snowys Outdoors", desc: "Dometic CFF 45 Portable Compressor Fridge", price: "$799.00 AUD", url: "https://www.snowys.com.au/search?q=dometic+cff45" },
                { store: "Camec", desc: "Engel MT-V35F 40L Portable Fridge Freezer", price: "$1,249.00 AUD", url: "https://camec.com.au/search?q=engel+fridge" }
            ]
        },
        solar: {
            title: "200W Folding Solar Panel / Mat Kit",
            query: "200W Solar Panel",
            items: [
                { store: "eBay Australia", desc: "200W Monocrystalline Folding Solar Mat Kit", price: "$129.00 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=200w+folding+solar+panel", cheapest: true },
                { store: "Bunnings Warehouse", desc: "200W Portable Solar Blanket Set", price: "$189.00 AUD", url: "https://www.bunnings.com.au/search/products?q=200w+solar+panel" },
                { store: "Supercheap Auto", desc: "Ridge Ryder 200W Solar Blanket Kit", price: "$249.00 AUD", url: "https://www.supercheapauto.com.au/search?q=200w%20solar" },
                { store: "Tentworld", desc: "Hardkorr 200W Solar Mat & Controller Kit", price: "$399.00 AUD", url: "https://www.tentworld.com.au/search?q=200w%20solar" },
                { store: "BCF Australia", desc: "Dometic 200W Heavy Duty Solar Blanket", price: "$599.00 AUD", url: "https://www.bcf.com.au/search?q=200w%20solar" }
            ]
        },
        heater: {
            title: "12V Diesel Air Heater Kit for Caravans",
            query: "Diesel Heater",
            items: [
                { store: "eBay Australia", desc: "12V 5KW All-In-One Diesel Parking Heater", price: "$149.00 AUD", url: "https://www.ebay.com.au/sch/i.html?_nkw=12v+diesel+heater", cheapest: true },
                { store: "Amazon Australia", desc: "12V 8KW Diesel Air Heater Kit", price: "$175.00 AUD", url: "https://www.amazon.com.au/s?k=12v+diesel+heater" },
                { store: "Caravan RV Camping", desc: "AuFocus 2KW Diesel Heater Kit", price: "$495.00 AUD", url: "https://www.caravanrvcamping.com.au/catalogsearch/result/?q=diesel+heater" },
                { store: "Snowys Outdoors", desc: "Belief 2KW Caravan Diesel Heater Kit", price: "$899.00 AUD", url: "https://www.snowys.com.au/search?q=diesel+heater" },
                { store: "Camec", desc: "Webasto Air Top 2000 STC Diesel Heater", price: "$1,850.00 AUD", url: "https://camec.com.au/search?q=webasto+diesel+heater" }
            ]
        }
    };

    function renderTableCards(items, title, subtitle) {
        document.getElementById('tableTitle').innerText = title;
        document.getElementById('tableSubtitle').innerText = subtitle || "Sorted: Low to High";

        const container = document.getElementById('priceList');
        container.innerHTML = '';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = `price-item ${item.cheapest ? 'cheapest' : ''}`;
            
            // Format price directly inside button
            const buttonText = item.price.includes('$') 
                ? `View ${item.price} — Checkout` 
                : `View Deals (${item.price})`;

            card.innerHTML = `
                <div class="item-info">
                    <span class="item-store">${item.store} ${item.cheapest ? '<span class="badge">Cheapest</span>' : ''}</span>
                    <span class="item-desc">${item.desc}</span>
                </div>
                <div style="text-align: right;">
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="store-link ${item.cheapest ? 'cheapest-btn' : ''}">
                        ${buttonText}
                    </a>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderStoreGrid(query) {
        const grid = document.getElementById('storeGrid');
        grid.innerHTML = '';
        const encodedQuery = encodeURIComponent(query);

        storeRegistry.forEach(store => {
            const card = document.createElement('div');
            card.className = 'store-card';
            card.innerHTML = `
                <span class="store-name">${store.name}</span>
                <a href="${store.url}${encodedQuery}" target="_blank" rel="noopener noreferrer" class="store-link" style="padding: 6px 12px; font-size: 0.8rem;">Find Price</a>
            `;
            grid.appendChild(card);
        });
    }

    // General Search Function for ANY item
    function executeGeneralSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        // Deselect Tag Buttons
        document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));

        const encodedQuery = encodeURIComponent(query);

        // Build a General 13-Store Low-to-High Comparison Table
        const generalResults = storeRegistry.map(store => ({
            store: store.name,
            desc: `Live Product Search for "${query}"`,
            price: store.tier,
            url: `${store.url}${encodedQuery}`,
            cheapest: store.cheapest || false
        }));

        renderTableCards(generalResults, `Search Results for "${query}"`, "13 Stores Ranked Low to High Tier");
        renderStoreGrid(query);
    }

    // Benchmark Button Function
    function loadBenchmark(key) {
        const data = benchmarks[key];
        if (!data) return;

        // Highlight Active Button
        document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
        if (document.getElementById(`btn-${key}`)) {
            document.getElementById(`btn-${key}`).classList.add('active');
        }

        document.getElementById('searchInput').value = data.query;
        renderTableCards(data.items, `Price Comparison: ${data.title}`, "Sorted: Low to High");
        renderStoreGrid(data.query);
    }

    // Allow Enter key press in search bar
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            executeGeneralSearch();
        }
    });

    // Default Load on launch
    loadBenchmark('battery');
</script>

</body>
</html>
